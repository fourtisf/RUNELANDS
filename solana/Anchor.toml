# Anchor workspace config — devnet scaffold (see README.md). Program id is a placeholder;
# run `anchor keys list` after `anchor build` and update it here and in lib.rs's declare_id!.
[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
isle_land = "Land11111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
